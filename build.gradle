buildscript {
	repositories {
		mavenLocal()
		mavenCentral()
    	maven {
      		url "https://artifacts.fizzpod.com/public/mvn/"
		}
		maven {
			url "https://plugins.gradle.org/m2/"
		}
	}
	dependencies {
		classpath 'com.fizzpod:gradle-java-opinion:0.14.28'
		classpath 'com.gradleup.shadow:shadow-gradle-plugin:8.3.6'
  	}
}
repositories {
	mavenLocal()
	mavenCentral()
	maven {
	  url "https://artifacts.fizzpod.com/public/mvn/"
	}
}

apply plugin: 'groovy'
apply plugin: 'application'
apply plugin: 'jacoco'

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

tasks.register('shadowJar', ShadowJar) {
    archiveClassifier.set('all')
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'com.fizzpod.wiserproxy.Main'
    }
}

application {
	applicationName = "wiser"
    mainClass = 'com.fizzpod.wiserproxy.Main'
}

dependencies {
	implementation 'org.apache.groovy:groovy-all:5.1.0'
	implementation 'org.apache.groovy:groovy-contracts:5.1.0'

	implementation 'org.tinylog:tinylog-api:2.7.0'
	implementation 'org.tinylog:tinylog-impl:2.7.0'
	implementation 'com.squareup.okhttp3:okhttp:5.1.0'

	testImplementation platform("org.spockframework:spock-bom:2.4-groovy-5.0")
  	testImplementation "org.spockframework:spock-core"
	testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"

}

/*
